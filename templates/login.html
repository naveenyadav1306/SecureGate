
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SecureGate</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #f8fafc;
            background: radial-gradient(circle at top, #172554, #020617 65%);
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 18px;
            box-shadow: 0 20px 60px #0006;
        }

        .logo {
            text-align: center;
            font-size: 34px;
            margin-bottom: 12px;
        }

        h1 {
            text-align: center;
            font-size: 26px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 14px;
            margin: 17px 0 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #475569;
            border-radius: 9px;
            background: #020617;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            border: none;
            border-radius: 9px;
            background: #0ea5e9;
            color: #00111c;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #38bdf8;
        }

        .message {
            padding: 11px;
            margin: 12px 0;
            border-radius: 8px;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .error {
            background: #451a1a;
            color: #fecaca;
        }

        .success {
            background: #052e25;
            color: #a7f3d0;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #94a3b8;
        }

        a {
            color: #38bdf8;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .card {
                padding: 24px 20px;
            }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="logo">🛡️</div>
        <h1>Welcome Back</h1>
        <p class="subtitle">
            Sign in securely to your SecureGate account.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="email">Email Address</label>
            <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                maxlength="254"
                required
            >

            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Sign In Securely</button>
        </form>

        <p class="footer">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create one</a>
        </p>

        <p class="footer">SECUREGATE · YOUR SECURITY MATTERS</p>
    </main>
</body>
</html>
